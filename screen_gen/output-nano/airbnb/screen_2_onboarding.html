<div class="app onboarding" role="application" aria-label="Onboarding">
  <style>
    .app.onboarding{--shade01:#FFFFFF;--shade02:#222222;--neutral01:#F7F7F7;--neutral03:#DDDDDD;--neutral04:#D3D3D3;--neutral07:#717171;--neutral08:#5E5E5E;--primary01:#F6475F;--primary02:#FF385C;--accent01:#F6D7DF;--accent02:#D03660;--link:#004CC4;--radius12:12px;--radius8:8px;--side:16px;--font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;--body16:16px;--body14:14px;}
    .onboarding *{box-sizing:border-box;}
    .onboarding .root{width:100%;min-height:100vh;background:var(--shade01);font-family:var(--font);color:var(--shade02);}
    .onboarding .appbar{padding:14px var(--side) 10px;border-bottom:1px solid #0000000D;background:var(--shade01);}
    .onboarding .toprow{display:flex;align-items:center;justify-content:space-between;}
    .onboarding .back{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--neutral03);background:var(--shade01);}
    .onboarding .back svg{width:20px;height:20px;fill:var(--shade02);} 
    .onboarding .step{font-size:13px;color:var(--neutral08);font-weight:600;}
    .onboarding .content{padding:18px var(--side) 110px;}

    .onboarding .hero{background:var(--neutral01);border:1px solid var(--neutral03);border-radius:12px;overflow:hidden;}
    .onboarding .hero-media{height:210px;position:relative;}
    .onboarding .hero-media .ph-img{height:100%;}
    .onboarding .hero-overlay{position:absolute;left:12px;right:12px;bottom:12px;background:var(--shade01);border:1px solid var(--neutral03);border-radius:12px;padding:12px;display:flex;gap:10px;align-items:flex-start;}
    .onboarding .hero-dot{width:32px;height:32px;border-radius:12px;background:var(--accent01);display:flex;align-items:center;justify-content:center;border:1px solid #0000000D;}
    .onboarding .hero-dot svg{width:18px;height:18px;fill:var(--accent02);} 
    .onboarding .hero-copy{flex:1;min-width:0;}
    .onboarding .h-title{font-size:22px;font-weight:600;line-height:26px;}
    .onboarding .h-sub{font-size:14px;color:var(--neutral08);margin-top:6px;line-height:20px;}

    .onboarding .section{margin-top:16px;}
    .onboarding .section-title{font-size:22px;font-weight:600;line-height:26px;}
    .onboarding .section-desc{font-size:16px;color:var(--neutral08);margin-top:8px;line-height:24px;}

    .onboarding .callout{margin-top:14px;border-radius:12px;background:var(--shade01);border:1px solid var(--neutral03);padding:16px;display:flex;gap:12px;align-items:flex-start;}
    .onboarding .callout-icon{width:32px;height:32px;border-radius:12px;background:var(--accent01);border:1px solid #0000000D;display:flex;align-items:center;justify-content:center;}
    .onboarding .callout-icon svg{width:18px;height:18px;fill:var(--accent02);} 
    .onboarding .callout-text .t1{font-size:14px;font-weight:600;}
    .onboarding .callout-text .t2{font-size:14px;color:var(--neutral08);margin-top:4px;line-height:20px;}

    .onboarding .btn{width:100%;height:47px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;}
    .onboarding .btn.primary{background:linear-gradient(90deg,#D33753 0%, #FF385C 100%);color:var(--shade01);} 
    .onboarding .btn.secondary{background:var(--shade02);color:var(--shade01);opacity:.92;}
    .onboarding .btnRow{display:flex;flex-direction:column;gap:12px;margin-top:18px;}

    .onboarding .linkrow{display:flex;align-items:center;justify-content:center;margin-top:10px;}
    .onboarding .link{font-size:12px;color:var(--link);font-weight:600;text-decoration:underline;}

    .onboarding .bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--shade01);border-top:1px solid var(--neutral03);padding:10px var(--side) 14px;z-index:3;}
    .onboarding .bottomnav-row{display:flex;gap:12px;}
    .onboarding .navspacer{flex:1;}
    .onboarding .navdot{width:56px;height:4px;border-radius:50px;background:var(--neutral03);} 
    .onboarding .navdot.active{background:var(--primary02);} 
  </style>

  <div class="root">
    <div class="appbar">
      <div class="toprow">
        <div class="back" role="button" aria-label="Back" tabindex="0">
          <svg viewBox="0 0 24 24"><path d="M15.4 5.4L9.8 11l5.6 5.6-1.4 1.4L7 11l7-7 1.4 1.4z"/></svg>
        </div>
        <div class="step">Step 1 of 3</div>
        <div style="width:44px;"></div>
      </div>
    </div>

    <div class="content">
      <div class="hero">
        <div class="hero-media">
          <div class="ph-img" data-q="people welcoming check-in counter"></div>
          <div class="hero-overlay" role="note" aria-label="Welcome callout">
            <div class="hero-dot" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2.8c5.1 0 9.2 4.1 9.2 9.2S17.1 21.2 12 21.2 2.8 17.1 2.8 12 6.9 2.8 12 2.8zm0 4.2a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2zm-1.1 4.3h2.2v6.1h-2.2v-6.1z"/></svg>
            </div>
            <div class="hero-copy">
              <div class="h-title">AirCover on every stay</div>
              <div class="h-sub">AirCover is comprehensive protection included for free with every booking.</div>
            </div>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="section-title">Start planning</div>
        <div class="section-desc">Save listings, compare prices, and keep track of upcoming check-in dates.</div>
      </div>

      <div class="callout" role="note" aria-label="Tip">
        <div class="callout-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M12 2.8c5.1 0 9.2 4.1 9.2 9.2S17.1 21.2 12 21.2 2.8 17.1 2.8 12 6.9 2.8 12 2.8zm0 4.2a1.1 1.1 0 100 2.2 1.1 1.1 0 000-2.2zm-1.1 4.3h2.2v6.1h-2.2v-6.1z"/></svg>
        </div>
        <div class="callout-text">
          <div class="t1">A rare find</div>
          <div class="t2">Hope’s place on Airbnb is usually fully booked—set a reminder and check back.</div>
        </div>
      </div>

      <div class="btnRow">
        <button class="btn primary" type="button" aria-label="Continue">Continue</button>
        <button class="btn secondary" type="button" aria-label="Maybe later">Maybe later</button>
      </div>

      <div class="linkrow">
        <a class="link" href="#" role="link" aria-label="Learn more">Learn more</a>
      </div>
    </div>

    <div class="bottomnav" aria-label="Onboarding progress">
      <div class="bottomnav-row" role="group" aria-label="Progress dots">
        <div class="navdot active" style="flex:1;" aria-hidden="true"></div>
        <div class="navspacer"></div>
        <div class="navdot" style="flex:1;" aria-hidden="true"></div>
        <div class="navspacer"></div>
        <div class="navdot" style="flex:1;" aria-hidden="true"></div>
      </div>
    </div>
  </div>
</div>
